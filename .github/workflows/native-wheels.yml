# Builds the V7 native kernel for Windows, Linux and macOS.
# Run it from the Actions tab ("Run workflow") or by pushing a tag v7*.
# Download the wheel for your system from the run's artifacts, then:
#   python -m pip install predatore_native-7.0.0-cp310-abi3-win_amd64.whl
name: native-wheels
on:
  workflow_dispatch:
  push:
    tags: ['v7*']
    paths: ['native/**', '.github/workflows/native-wheels.yml']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x64
          - os: ubuntu-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: native
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: Parity tests against the Python reference
        shell: bash
        run: |
          python -m pip install native/dist/*.whl
          python launcher.py --engine-status
          python -m unittest tests.test_v7_native_parity -v
      - uses: actions/upload-artifact@v4
        with:
          name: predatore-native-${{ matrix.os }}
          path: native/dist/*.whl

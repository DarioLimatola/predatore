[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predatore-boolean-engine"
version = "7.0.0"
description = "Reusable Boolean vector learner from Predatore V7.0"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["boolean_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
